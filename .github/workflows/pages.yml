name: GitHub Pages確認環境

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publicディレクトリをPagesへデプロイ
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Pagesを設定
        uses: actions/configure-pages@v6

      # GitHub Pagesは確認環境なので、公開物に加えて検証用プロトタイプも見られるようにする。
      # 本番デプロイは public/ だけを送るため、experiments/ が本番へ出ることはない。
      - name: 公開物と検証用プロトタイプをまとめる
        run: |
          set -euo pipefail
          rm -rf tmp/pages
          mkdir -p tmp/pages
          cp -r public/. tmp/pages/
          cp -r experiments tmp/pages/experiments

      - name: 確認用ディレクトリをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: tmp/pages

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
