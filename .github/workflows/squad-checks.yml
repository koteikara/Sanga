name: スカッド事前検証

on:
  workflow_call:

permissions:
  contents: read

jobs:
  squad-checks:
    name: スカッド事前検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: '1.62.0'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: スカッド静的検証をまとめて実行
        run: npm run check:squad

      - name: PlaywrightとChromiumを準備
        run: |
          npm install --no-save --package-lock=false "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: スカッドの実ブラウザレイアウトを検証
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --directory public >/tmp/sanga-squad-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8123/squad.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ローカル確認サーバーを起動できませんでした。"
              cat /tmp/sanga-squad-http.log
              exit 1
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:8123/squad.html npm run check:squad:browser
