name: チケット販売スケジュールの取り込み

# 公式のチケット販売スケジュール（常設・表形式）を1日1回取得し、
# docs/sheets/ticket-sales.current.csv に差分があればPRを作る。
#
# 取得マナーは docs/supporter-timeline-design.md の「公式サイトの利用条件」に従う。
# robots.txt に一般的な Disallow は無いが Crawl-delay: 10 の指定があるため、
# 1回の実行で1リクエストだけ送り、頻度は1日1回にとどめる。
# 公式サイトへは何も書き込まない読み取り専用の処理で、デプロイは行わない。

on:
  schedule:
    # 22:00 JST（13:00 UTC）。販売開始は11:00と12:00 JSTのため、
    # その日の変更が出そろったころに見る。
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force_pr:
        description: '内容に変化がなくてもCSVを更新してPRを作る（取得日時だけの更新）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # 「手で確かめるアウェイ戦」の一覧をIssue1本で持ち、毎日書き換える。
  issues: write

concurrency:
  group: ticket-sales-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 販売スケジュールを取り込む
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsを設定
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # 実行のたびに新しいランナーなので、24時間ガード（前回取得時刻の記録）は
      # 効かない。頻度は on.schedule と concurrency で担保する。
      - name: 公式ページを取得
        run: node tools/fetch-ticket-sales.js tmp/ticket-schedule.html

      # 取得日時の記録ファイルをCSVと一緒にコミットしてしまわないよう、
      # tmp/ 配下だけを使う（tmp/ は .gitignore 済み）。

      # 既存CSVとの違いが取得日時と画面表示（受付中・販売中）だけなら書き換えない。
      # 販売の開始・終了で毎日変わるため、そのままでは中身の変わらないPRが毎日立つ。
      - name: CSVを更新
        env:
          FORCE_PR: ${{ inputs.force_pr }}
        run: |
          set -euo pipefail

          args=(tmp/ticket-schedule.html docs/sheets/ticket-sales.current.csv)
          if [ "${FORCE_PR:-false}" != "true" ]; then
            args+=(--keep-unchanged)
          fi

          # 取り込み結果はPR本文と実行サマリーで使うので残す。
          node tools/parse-ticket-sales.js "${args[@]}" | tee tmp/parse-result.txt

      # アウェイ席の販売状態も同じ流れで取り込む。取得先が別サイトなので、
      # 失敗してもホーム戦の取り込みは止めない（continue-on-error）。
      # **ただし黙って終わらせない。** 最後の「アウェイの取り込み結果を確かめる」で
      # ジョブを失敗させる。2026-08-31から2026-09-10まで、ここが毎回失敗していたのに
      # 実行は成功と表示され、10日間気付けなかった。
      #
      # 取得日時・確認日しか変わらない日に書き換えないよう --keep-unchanged を付ける。
      # 付けないと中身の変わらないPRが毎日立ち、やがて誰も開かなくなる。
      - name: アウェイの販売状態を取得
        id: away
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 10
          node tools/fetch-away-tickets.js tmp/away-tickets.html --force
          node tools/parse-away-tickets.js tmp/away-tickets.html --keep-unchanged
          # 段階1が拾った試合ページから一般発売の開始日時を取る。
          # Jリーグチケットは「発売前」の試合も載せるようになったため、
          # 発売より前に開始日時が読める試合がある。
          node tools/fetch-away-sales.js --force
          node tools/parse-away-sales.js --keep-unchanged

      # アウェイが失敗した日も、静かな日（PRが立たない日）にこそ気付けるようにする。
      - name: アウェイの失敗を記録
        if: steps.away.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo '## アウェイの取り込みに失敗しました'
            echo
            echo 'ホーム戦の取り込みは続けています。アウェイ席の販売状態と発売日時は、'
            echo 'この実行では更新されていません（前回の値のままです）。'
            echo
            echo "実行ログ: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::アウェイの取り込みに失敗しました。アウェイ席の情報は更新されていません。"

      - name: 差分の有無を判定
        id: judge
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain docs/sheets/ticket-sales.current.csv docs/sheets/away-tickets.current.csv docs/sheets/away-sales.current.csv)" ]; then
            echo "販売スケジュールとアウェイの販売状態に変化はありませんでした。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # **差分の有無と関係なく走らせる。** 手で確かめるアウェイ戦は、CSVが動かない
      # 静かな日にも残り続ける。PRが立つ日にしか出さないと、いちばん気付きたい
      # 「誰も見ていないまま試合が近づく」状態を拾えない。
      - name: 手で確かめるアウェイ戦を挙げる
        id: gaps
        run: |
          set -euo pipefail
          mkdir -p tmp
          node tools/report-away-gaps.js > tmp/away-gaps.md
          if [ -s tmp/away-gaps.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo '## 手で確かめるアウェイ戦'
              echo
              cat tmp/away-gaps.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # **Issueは1本だけ持ち、中身を書き換える。** 毎日新しく立てると溜まって読まれなくなる。
      # GitHubは内容が変わったときだけ通知するので、同じ状態が続く日は静かなまま。
      - name: 一覧のIssueを更新する
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.gaps.outputs.found }}
        run: |
          set -euo pipefail

          title='手で確かめるアウェイ戦'
          label='away-gaps'

          # ラベルが無いとIssueを作れない。すでにあれば失敗するので握りつぶす。
          gh label create "$label"             --description 'アウェイ席の情報を手で入れる必要がある試合の一覧'             --color 'B60205' 2>/dev/null || true

          number=$(gh issue list --state open --label "$label"             --json number --jq '.[0].number // empty')

          if [ "${FOUND}" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file tmp/away-gaps.md
              echo "Issue #${number} を更新しました。"
            else
              gh issue create --title "$title" --label "$label" --body-file tmp/away-gaps.md
              echo "Issueを作成しました。"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number"               --comment '手で確かめるアウェイ戦は無くなりました。必要になればまた開きます。'
            echo "Issue #${number} を閉じました。"
          else
            echo "手で確かめるアウェイ戦はありません。"
          fi

      # retrieved_at_jst は全行で動くため、生のdiffでは124行すべてが書き換わったように
      # 見えて何が変わったか読めない。パーサが出した変更一覧のほうを見せる。
      - name: 変更内容を実行サマリーに表示
        if: steps.judge.outputs.changed == 'true'
        run: |
          set -euo pipefail

          {
            echo '## 販売スケジュールの変更'
            echo
            echo '```text'
            cat tmp/parse-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PRを作る前に、取り込んだCSVが calendar-events を組み立てられる形かを見る。
      # 公式ページの構成が変わったまま気付かずCSVを差し替えるのを避けるため。
      # 公開ページが読むJSONはCSVから作る。同じPRに入れないと、CSVだけ新しく
      # 公開ページだけ古い状態ができる。
      - name: 公開JSONを生成
        if: steps.judge.outputs.changed == 'true'
        run: npm run generate:timeline:public

      - name: 取り込み結果を検証
        if: steps.judge.outputs.changed == 'true'
        run: npm run check:static

      - name: 取り込みPRを作成
        if: steps.judge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWAY_OUTCOME: ${{ steps.away.outcome }}
        run: |
          set -euo pipefail

          branch="automation/ticket-sales-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add docs/sheets/ticket-sales.current.csv docs/sheets/away-tickets.current.csv docs/sheets/away-sales.current.csv public/data/calendar-events.json public/timeline.ics
          git commit -m "data: チケット販売スケジュールを取り込む"
          git push -u origin "$branch"

          {
            echo '## Summary'
            echo
            echo '- 公式のチケット販売スケジュールを取得し、`docs/sheets/ticket-sales.current.csv` を更新しました。'
            echo '- **公開JSONを変更するPRです。** 同じCSVから `public/data/calendar-events.json` を作り直しています。公開ページ（`public/timeline.html`）が読むデータです。'
            echo '- **購読フィード（`public/timeline.ics`）も作り直しています。** マージすると購読している人のカレンダーに届きます。取り消しはまだできないため（墓標は未実装）、予定が消えていないかは特に確認してください。'
            echo '- 内容を確認してからマージしてください。自動ではマージしません。'
            echo '- アウェイ席の販売状態（`docs/sheets/away-tickets.current.csv`）も更新しています。発売中の試合に加え、**発売前の試合も載ります**。**ただし載っていない試合は「発売前」ではありません**（別のプレイガイドで売っている場合があります）。'
            echo '- `tools/fetch-ticket-sales.js` と `tools/parse-ticket-sales.js` による自動取り込みです。手作業の編集は含みません。'
            if [ "${AWAY_OUTCOME}" = "failure" ]; then
              echo '- **アウェイの取り込みは失敗しました。** このPRのアウェイ関連ファイルは前回の値のままです。実行ログを確認してください。'
            fi
            echo '- 取得日時と画面表示（受付中・販売中）だけの違いでは更新しません。このPRがあるということは、販売日程か掲載状態が変わっています。'
            echo
            echo '## 変更内容'
            echo
            echo '`retrieved_at_jst` は全行で動くため、差分そのものは124行すべてが書き換わって見えます。実際に変わったのは次の内容です。'
            echo
            echo '```text'
            cat tmp/parse-result.txt
            echo '```'
            echo
            echo '## Testing'
            echo
            echo '- `npm run check:static`（`check:timeline` → `check:ticket-sales:current` を含む）'
            echo
            echo '## 確認してほしいこと'
            echo
            echo '- 販売日時の変更が、公式ページの表示と一致しているか。'
            echo '- 掲載済みだった試合が未掲載に戻っていないか（戻っている場合は取得の失敗を疑う）。'
            echo
            echo '実行: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > pr-body.md

          # PR作成は、リポジトリ設定「Allow GitHub Actions to create and approve
          # pull requests」が無効だと拒否される。その場合もブランチのpushは
          # 済んでいて取り込み自体は成功しているため、ジョブは失敗にせず、
          # 人がPRを作れるリンクを案内する。
          if gh pr create --draft --base main --head "$branch" \
            --title "data: チケット販売スケジュールを取り込む" \
            --body-file pr-body.md; then
            echo "取り込みPRを作成しました。"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${branch}"
            {
              echo
              echo '## PRは自動作成できませんでした'
              echo
              echo "取り込んだ内容はブランチ \`${branch}\` にpush済みです。次のリンクから手動でPRを作成してください。"
              echo
              echo "$url"
              echo
              echo 'GitHub Actionsによる自動作成を有効にする場合は、Settings → Actions → General → Workflow permissions の'
              echo '「Allow GitHub Actions to create and approve pull requests」を有効にします。'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::warning::PRを自動作成できませんでした。ブランチ ${branch} は push 済みです: ${url}"
          fi

          rm -f pr-body.md

      # ここで初めてジョブを赤くする。ホーム戦の取り込みとPR作成は先に終わっているので、
      # アウェイの失敗でホーム戦が止まることはない。**沈黙だけをやめる。**
      - name: アウェイの取り込み結果を確かめる
        if: always() && steps.away.outcome == 'failure'
        run: |
          echo 'アウェイの取り込みに失敗しています。ホーム戦の取り込みは終わっています。'
          echo '上の「アウェイの販売状態を取得」のログを見てください。'
          exit 1
