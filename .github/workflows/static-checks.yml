name: Static Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Git差分の空白エラーを確認
        run: git diff --check

      - name: 日程JSONを検証
        run: node tools/validate-matches.js

      - name: 生成JSONを厳格検証
        run: node tools/validate-generated-matches.js public/data/matches.json --expected-count 57 --strict

      - name: ホテルJSONを検証
        run: node tools/validate-hotels.js

      - name: 選手JSONを検証
        run: node tools/validate-players.js

      - name: JavaScript構文を検証
        run: node --check public/assets/app.js

      - name: JavaScript契約を検証
        run: node tools/validate-app-contract.js

      - name: CSS波括弧数を検証
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('public/assets/style.css').read_text(encoding='utf-8')
          open_count = css.count('{')
          close_count = css.count('}')

          if open_count != close_count:
              raise SystemExit(f'CSS brace count mismatch: {{={open_count}, }}={close_count}')

          print(f'CSS brace count OK: {{={open_count}, }}={close_count}')
          PY

      - name: HTMLのCSS/JS参照を検証
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('public/sanga202627season.html').read_text(encoding='utf-8')
          required_refs = [
              'assets/style.css',
              'assets/app.js',
          ]
          missing = [ref for ref in required_refs if ref not in html]

          if missing:
              raise SystemExit('Missing HTML asset reference(s): ' + ', '.join(missing))

          print('HTML asset references OK: ' + ', '.join(required_refs))
          PY

  # 文書だけの変更で、Chromiumを使う重い検証まで走らせない。
  # 「文書だと分かるものだけを除外する」向きで判定し、判断がつかない変更は
  # すべて検証する側へ倒す。許可リスト方式にすると、新しく増えたファイルが
  # 条件から漏れて検証されないまま通ってしまうため。
  # 本番デプロイ（deploy-production.yml）はこの判定を通さず、変更内容に
  # かかわらず必ずスカッド事前検証を実行する。
  detect-changes:
    name: 変更範囲を判定
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.judge.outputs.docs-only }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 文書だけの変更かを判定
        id: judge
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # 比較元をたどれない場合（初回pushなど）は判定せず、検証する側へ倒す
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "比較元をたどれないため、スカッド事前検証を実行します。"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if [ -z "$changed" ]; then
            echo "変更ファイルがないため、スカッド事前検証を実行します。"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "変更ファイル:"
          echo "$changed" | sed 's/^/  /'

          # docs/配下、リポジトリ直下のMarkdown、LICENSEだけなら文書のみとみなす。
          # AGENTS.mdなど直下のMarkdownは実装ルールを含むが、公開物ではないため
          # ブラウザ検証の対象にはならない。
          others="$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$)' || true)"

          if [ -z "$others" ]; then
            echo "文書だけの変更のため、スカッド事前検証を省略します。"
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "文書以外の変更があるため、スカッド事前検証を実行します:"
            echo "$others" | sed 's/^/  /'
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  squad-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/squad-checks.yml
