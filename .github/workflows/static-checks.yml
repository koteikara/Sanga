name: Static Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsを設定
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Git差分の空白エラーを確認
        run: git diff --check

      - name: 静的検証をまとめて実行
        run: npm run check:static

  # 文書だけの変更で、Chromiumを使う重い検証まで走らせない。
  # 「文書だと分かるものだけを除外する」向きで判定し、判断がつかない変更は
  # すべて検証する側へ倒す。許可リスト方式にすると、新しく増えたファイルが
  # 条件から漏れて検証されないまま通ってしまうため。
  # 本番デプロイ（deploy-production.yml）はこの判定を通さず、変更内容に
  # かかわらず必ずスカッド事前検証を実行する。
  detect-changes:
    name: 変更範囲を判定
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.judge.outputs.docs-only }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 文書だけの変更かを判定
        id: judge
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # 比較元をたどれない場合（初回pushなど）は判定せず、検証する側へ倒す
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "比較元をたどれないため、スカッド事前検証を実行します。"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 三点比較（BASE...HEAD）で、分岐したところからの変更だけを見る。
          # 二点比較（BASE HEAD）だと、baseにあってheadに無いファイルまで
          # 「変更された」と出る。ブランチがbaseより遅れていると、自分が
          # 触っていないファイルが並び、省略できるはずのPRで検証が走る
          # （2026-09-08、PR #249で実際に起きた）。
          # なお、遅れていてもマージで相手の変更は消えない。実害は判定と、
          # 古い土台のまま検証していること（下の警告）の2点。
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA")"

          # baseに追いついていないPRは、baseの最新と合わせた状態を検証していない。
          # 落とすとbaseが動くたび全PRが赤くなり、赤が常態化して意味を失うため、
          # 警告にとどめてマージ前の判断材料にする。
          behind="$(git rev-list --count "$HEAD_SHA".."$BASE_SHA")"
          if [ "$behind" -gt 0 ]; then
            echo "::warning title=baseに${behind}件遅れています::" \
              "このPRは最新のbaseと組み合わせた状態を検証していません。" \
              "マージ前にbaseを取り込むと、その状態でCIが回ります。"
            {
              echo "### baseに${behind}件遅れています"
              echo ""
              echo "このPRは最新のbaseと組み合わせた状態を検証していません。"
              echo "マージ前にbaseを取り込むと、その状態でCIが回ります。"
              echo ""
              echo '```'
              git log --oneline "$HEAD_SHA".."$BASE_SHA" | sed 's/^/  /'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$changed" ]; then
            echo "変更ファイルがないため、スカッド事前検証を実行します。"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "変更ファイル:"
          echo "$changed" | sed 's/^/  /'

          # docs/配下、リポジトリ直下のMarkdown、LICENSEだけなら文書のみとみなす。
          # AGENTS.mdなど直下のMarkdownは実装ルールを含むが、公開物ではないため
          # ブラウザ検証の対象にはならない。
          others="$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$)' || true)"

          if [ -z "$others" ]; then
            echo "文書だけの変更のため、スカッド事前検証を省略します。"
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "文書以外の変更があるため、スカッド事前検証を実行します:"
            echo "$others" | sed 's/^/  /'
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  squad-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/squad-checks.yml
