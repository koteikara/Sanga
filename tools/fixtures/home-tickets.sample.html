<!doctype html>
<!--

  リーグ戦（相手欄あり）、ACL（相手欄なし・試合名に「対」）、付随チケット（その他）、

-->

          <div class="vs-box-info"><div><span class="vs-box-info-day">11/21</span> <span class="vs-box-info-time">14:00</span></div></div>
          <div class="vs-box-place"><p class="team-name">ホーム対戦相手</p><span>サンプルスタジアム</span></div>
