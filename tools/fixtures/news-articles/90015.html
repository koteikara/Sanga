<!doctype html>
<!--
  tools/parse-news-times.js の回帰確認用。ACLアウェイのチケットを試します。作り物です。

  ACLアウェイは常設の販売スケジュール表にも Jリーグチケットにも載らず、京都公式の記事が
  唯一の情報源です。試しているのは次の3つです。
    1. 「当日発売」「前売販売」から時刻を読む
    2. 相対表記の数字（キックオフ2時間前・試合5日前）に惑わされない
    3. 開門と当日券がどちらも同じ時刻でも、両方残る（IDに種類が入っているか）
-->

</dl>

<p>前売販売：試合5日前（7/27）13:00～</p>
