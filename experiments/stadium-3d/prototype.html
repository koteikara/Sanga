<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンガスタジアム 座席ビュー（プロトタイプ）</title>
<link rel="stylesheet" href="prototype.css">

<!--
  three.jsはCDNから固定バージョンで読む。プロトタイプ段階のため同梱しない。
  ライセンスと利用箇所は THIRD_PARTY_NOTICES.md を正とする。
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<main id="app"></main>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div>
      <p class="kicker">SANGA STADIUM BY KYOCERA · 3D SEAT VIEW</p>
      <h1>サンガスタジアム<br>座席からの見え方</h1>
    </div>

    <!-- 狭い画面ではパネルが3Dを覆う。畳んで見られるようにする -->
    <button type="button" id="panelToggle" class="panel-toggle"
            aria-expanded="true" aria-controls="panelBody">閉じる</button>
  </div>

  <div class="panel-body" id="panelBody">
  <p class="intro">
    ブロックと位置を選ぶと、その付近の着席視点に移動します。
    3D上のブロックを直接クリックして選択することもできます。
  </p>

  <div class="field">
    <label for="stand">スタンド</label>
    <select id="stand">
      <option value="W">メインスタンド（西 / W）</option>
      <option value="E">バックスタンド（東 / E）</option>
      <option value="S">南サイドスタンド（南 / S）</option>
      <option value="N">北サイドスタンド（北 / N）</option>
    </select>
  </div>

  <div class="field">
    <label for="block">ブロック</label>
    <select id="block"></select>
  </div>

  <div class="field">
    <label for="tier">スタンド層</label>
    <select id="tier">
      <option value="lower">下層スタンド</option>
      <option value="upper">上層スタンド</option>
    </select>
  </div>

  <div class="field">
    <label for="row">前後位置 <span id="rowValue">中央</span></label>
    <input id="row" type="range" min="0" max="100" value="50">
  </div>

  <div class="field">
    <label for="seat">左右位置 <span id="seatValue">中央</span></label>
    <input id="seat" type="range" min="0" max="100" value="50">
  </div>

  <button type="button" id="viewButton">この位置から見る</button>
  <button type="button" id="overviewButton" class="secondary">全体表示へ戻る</button>
  <button type="button" id="centerButton" class="secondary">ピッチ中央へ向き直す</button>

  <div class="toggles">
    <label class="toggle"><input id="roofToggle" type="checkbox" checked> 屋根を表示</label>
    <label class="toggle"><input id="seatToggle" type="checkbox" checked> 座席を表示</label>
    <label class="toggle"><input id="labelToggle" type="checkbox" checked> ブロック名</label>
    <label class="toggle"><input id="structureToggle" type="checkbox" checked> 外壁を表示</label>
    <label class="toggle"><input id="screenToggle" type="checkbox" checked> 大型映像</label>
  </div>

  <div class="info" id="info">
    <strong>ブロックを選択してください</strong>
  </div>

  <p class="warning">
    公開資料を基にした概算モデルです。実際の列・席番号、手すり・通路・観客による遮蔽、
    座席の実配置、屋根構造の詳細は未反映または推定です。
  </p>
  </div>
</aside>

<p id="status" role="status">全体表示｜ブロックを選択してください</p>
<p id="help">ドラッグ：回転 ／ ホイール：拡大 ／ ブロッククリック：選択</p>
<div id="tooltip" aria-hidden="true"></div>

<div id="boot" class="boot">
  <p id="bootMessage">3Dを読み込んでいます…</p>
</div>

<!--
  読み込み失敗の受け皿。prototype.js はモジュールなので、CDNへ到達できない環境や
  WebGLが無い環境では実行そのものが始まらず、画面が無言で空になる。
  ここだけは通常スクリプトで置き、一定時間たっても起動しなければ理由を出す。
-->
<script>
  window.__stadiumBootTimer = setTimeout(function () {
    var message = document.getElementById("bootMessage");
    if (!message) return;
    message.textContent =
      "3Dを読み込めませんでした。CDN（cdn.jsdelivr.net）へ到達できない環境か、" +
      "WebGLを使えない環境の可能性があります。";
  }, 8000);
</script>

<script type="module" src="prototype.js"></script>
</body>
</html>
