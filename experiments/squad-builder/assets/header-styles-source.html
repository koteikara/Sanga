<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>header sources</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;flex-direction:column;gap:20px;padding:20px;align-items:flex-start}
.banner{width:960px;height:300px;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden}

/* ============ グラフィティ ============ */
#graffiti{font-family:"DejaVu Sans",sans-serif}
#graffiti .tag{
  font-size:104px;font-weight:700;font-style:italic;letter-spacing:.01em;color:#f5f5f5;
  -webkit-text-stroke:10px #111;paint-order:stroke fill;
  text-shadow:12px 12px 0 #9b3fd4, 12px 12px 0 #111;
  transform:rotate(-3deg);
}
#graffiti .sub{
  margin-top:16px;font-size:34px;font-weight:700;color:#f3e6ff;background:#7b1fa2;
  padding:4px 22px;transform:rotate(2deg);letter-spacing:.18em;
  box-shadow:6px 6px 0 #111;
}
#graffiti .drip{position:absolute;background:#9b3fd4;border-radius:0 0 50% 50%}

/* ============ サイバーコア ============ */
#cyber{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;color:#eadcff}
#cyber .top{font-size:20px;letter-spacing:.5em;color:#c77dff;margin-bottom:14px}
#cyber .main{font-size:82px;font-weight:700;letter-spacing:.14em;color:#f6ecff;
  text-shadow:3px 0 #c77dff, -3px 0 #6a1b9a}
#cyber .bar{display:flex;gap:8px;margin-top:18px;align-items:center}
#cyber .bar i{display:block;width:60px;height:8px;background:#9b3fd4}
#cyber .bar span{font-size:18px;letter-spacing:.36em;color:#c77dff}
#cyber .brackets{position:absolute;inset:24px 30px;border:2px solid #9b3fd4;clip-path:polygon(0 0,14% 0,14% 3%,86% 3%,86% 0,100% 0,100% 100%,86% 100%,86% 97%,14% 97%,14% 100%,0 100%)}

/* ============ ヴェイパーウェーブ ============ */
#vapor{font-family:"DejaVu Sans",sans-serif}
#vapor .jp{font-family:"IPAGothic",sans-serif;font-size:30px;letter-spacing:.5em;color:#fff;
  text-shadow:0 0 14px #c77dff;margin-bottom:10px}
#vapor .main{font-size:88px;font-weight:700;letter-spacing:.22em;
  background:linear-gradient(180deg,#ffffff,#efd8ff 40%,#b98cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 4px 0 #7b1fa2) drop-shadow(-3px -3px 0 #c77dff)}
#vapor .sub{margin-top:14px;font-size:24px;letter-spacing:.6em;color:#fff;opacity:.85}

/* ============ シンセウェーブ ============ */
#synth{font-family:"DejaVu Sans",sans-serif}
#synth .main{font-size:92px;font-weight:700;font-style:italic;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 0%,#f0dcff 30%,#b464ff 62%,#6a1b9a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(155,63,212,.95))}
#synth .sub{margin-top:16px;font-size:26px;letter-spacing:.52em;color:#e2c4ff;
  text-shadow:0 0 12px #9b3fd4}
#synth .line{width:620px;height:3px;margin-top:16px;
  background:linear-gradient(90deg,transparent,#9b3fd4,#e2c4ff,transparent);
  box-shadow:0 0 14px #9b3fd4}

/* ============ スクラップブック ============ */
#scrap{font-family:"DejaVu Serif",serif}
#scrap .word{display:flex;gap:8px;align-items:flex-end}
#scrap .word span{
  display:inline-block;padding:6px 12px;font-size:74px;font-weight:700;line-height:1;
  background:#f3ecff;color:#2b0a3d;box-shadow:3px 4px 0 rgba(43,10,61,.4);
}
#scrap .word span:nth-child(2n){background:#4a1466;color:#f3ecff;transform:rotate(3deg)}
#scrap .word span:nth-child(3n){transform:rotate(-4deg);font-family:"DejaVu Sans Mono",monospace}
#scrap .word span:nth-child(5n){background:#c9a3e8;transform:rotate(2deg)}
#scrap .note{
  margin-top:20px;font-family:"DejaVu Sans",sans-serif;font-size:26px;letter-spacing:.3em;
  background:#4a1466;color:#f3ecff;padding:6px 20px;transform:rotate(-1.5deg);
  box-shadow:3px 4px 0 rgba(43,10,61,.4);
}
#scrap .tape{position:absolute;width:120px;height:34px;background:rgba(201,163,232,.7);
  box-shadow:0 2px 6px rgba(0,0,0,.25)}
</style>
</head>
<body>

<div class="banner" id="graffiti">
  <div class="drip" style="left:180px;top:0;width:14px;height:70px"></div>
  <div class="drip" style="left:640px;top:0;width:10px;height:48px"></div>
  <div class="drip" style="left:760px;top:0;width:16px;height:92px"></div>
  <div class="tag">STARTING XI</div>
  <div class="sub">PREDICTED</div>
</div>

<div class="banner" id="cyber">
  <div class="brackets"></div>
  <div class="top">// SQUAD_BUILD.EXE</div>
  <div class="main">STARTING XI</div>
  <div class="bar"><i></i><span>PREDICTED</span><i></i></div>
</div>

<div class="banner" id="vapor">
  <div class="jp">予想先発</div>
  <div class="main">STARTING XI</div>
  <div class="sub">PREDICTED</div>
</div>

<div class="banner" id="synth">
  <div class="main">STARTING XI</div>
  <div class="line"></div>
  <div class="sub">PREDICTED</div>
</div>

<div class="banner" id="scrap">
  <div class="tape" style="left:150px;top:24px;transform:rotate(-8deg)"></div>
  <div class="tape" style="right:150px;bottom:30px;transform:rotate(6deg)"></div>
  <div class="word">
    <span>S</span><span>T</span><span>A</span><span>R</span><span>T</span>
    <span>I</span><span>N</span><span>G</span><span>&nbsp;XI</span>
  </div>
  <div class="note">PREDICTED</div>
</div>

</body>
</html>
